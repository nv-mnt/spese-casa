name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Dipendenze
        run: pip install -r backend/requirements-dev.txt
      - name: Test di integrazione
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Statici + end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Dipendenze frontend
        working-directory: frontend
        run: npm ci
      - name: Dipendenze backend (servono agli E2E)
        run: pip install -r backend/requirements-dev.txt

      # I controlli statici vengono prima: se qui e' rosso, gli E2E non servono.
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Build di produzione
        working-directory: frontend
        run: npm run build

      - name: Browser di Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Test end-to-end
        working-directory: frontend
        env:
          # In CI non c'e' il virtualenv locale: si usa il python di sistema.
          E2E_PYTHON: python
        run: npm run e2e

      - name: Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
