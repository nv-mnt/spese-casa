<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gestionale delle spese condivise di casa" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff4e8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1524" />
    <!-- PWA: installabile e a schermo intero su iPhone. -->
    <!-- Il link al manifest lo inietta vite-plugin-pwa: scriverlo anche qui
         ne produceva due nella pagina servita. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spese Casa" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Splash iOS: una sola immagine, ridimensionata da Safari. -->
    <link rel="apple-touch-startup-image" href="/pwa-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='10' fill='%23c4aef7' stroke='%23463755' stroke-width='3'/%3E%3Cpath d='M6.5 14.5 16 7l9.5 7.5' fill='none' stroke='%23463755' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='9.5' y='14' width='13' height='10' rx='3' fill='%23ffd9b5' stroke='%23463755' stroke-width='2.6'/%3E%3Ccircle cx='13.5' cy='19' r='1.3' fill='%23463755'/%3E%3Ccircle cx='18.5' cy='19' r='1.3' fill='%23463755'/%3E%3C/svg%3E"
    />
    <title>Spese Casa</title>
    <script>
      /* Applica il tema salvato prima del primo paint, per evitare il lampo chiaro. */
      (function () {
        try {
          var salvato = localStorage.getItem('spese-casa.theme');
          var scuro =
            salvato === 'dark' ||
            ((!salvato || salvato === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (scuro) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = scuro ? 'dark' : 'light';
        } catch (e) {
          /* storage non disponibile: si parte dal tema chiaro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
